name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write  # Changed to write so we can commit package-lock.json
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'  # Now enabled since package-lock.json exists
      
      - name: Install dependencies
        run: npm install
        continue-on-error: false
      
      - name: Run security audit
        run: npm audit --audit-level=moderate || echo "Audit completed with vulnerabilities (non-blocking)"
        continue-on-error: true  # Don't fail build on audit warnings
      
      - name: Commit package-lock.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update package-lock.json [skip ci]" && git push || echo "No changes or push failed"
          else
            echo "package-lock.json unchanged"
          fi
        continue-on-error: true  # Don't fail workflow if commit fails
      
      - name: Build Docusaurus
        run: npm run build
        continue-on-error: false
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
