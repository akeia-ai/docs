name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write  # Changed to write so we can commit package-lock.json
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node (without cache)
        uses: actions/setup-node@v4
        with:
          node-version: 18
          # Cache disabled for first run - will be enabled after package-lock.json exists
      
      - name: Install dependencies
        run: npm install
      
      - name: Commit package-lock.json if generated
        run: |
          if [ -f package-lock.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git diff --staged --quiet || git commit -m "chore: add package-lock.json [skip ci]"
            git push || echo "package-lock.json already committed or push failed"
          fi
      
      - name: Build Docusaurus
        run: npm run build
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
